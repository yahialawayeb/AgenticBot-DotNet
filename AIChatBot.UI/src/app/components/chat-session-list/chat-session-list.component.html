<div class="chat-session-list card shadow-sm">
  <div
    class="card-header bg-light text-dark d-flex justify-content-between align-items-center"
  >
    <h6 class="mb-0 section-header">Sessions</h6>
    <button class="btn btn-success btn-sm" (click)="onNewChatClick()">
      + New Chat
    </button>
  </div>
  <ul class="list-group list-group-flush session-list">
    <li
      *ngFor="let session of sessions"
      class="list-group-item d-flex align-items-center"
      [class.list-group-item-primary]="isSelected(session)"
      [class.selected-session]="isSelected(session)"
      (click)="onSessionClick(session)"
    >
      <span class="fw-bold me-2">🗨️</span>
      <span class="me-auto text-truncate">{{ session.name }}</span>
      <button
        class="btn btn-sm btn-outline-danger border-0"
        (click)="onDeleteClick(session, $event)"
        title="Delete"
      >
        🗑️
      </button>
    </li>
    <li
      *ngIf="sessions.length === 0"
      class="list-group-item text-muted text-center"
    >
      No sessions found.
    </li>
  </ul>
</div>
